# VPS — shared Postgres/Redis on external network `infra`.
#
#   docker compose -f docker-compose.infra.yml pull
#   docker compose -f docker-compose.infra.yml up -d
#
# Override the published image with APPBOT_IMAGE, or pass --build to compile
# from this tree.

name: application-bot

volumes:
  chroma_data: {}

networks:
  appbot: {}
  infra:
    external: true
    name: infra

services:
  validate:
    image: ${APPBOT_IMAGE:-ghcr.io/oriel-beck/application-bot:latest}
    build: .
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
      REDIS_HOST: redis
    volumes:
      - ./config.json:/app/config.json:ro
      - ./json:/app/json
    command: ['node', 'src/scripts/validate-config.js']
    restart: 'no'
    networks:
      - appbot

  appbot:
    image: ${APPBOT_IMAGE:-ghcr.io/oriel-beck/application-bot:latest}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
      REDIS_HOST: redis
    volumes:
      - ./config.json:/app/config.json:ro
      - ./json:/app/json
    depends_on:
      validate:
        condition: service_completed_successfully
      chroma:
        condition: service_started
      ingestor:
        condition: service_completed_successfully
    networks:
      - appbot
      - infra

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: 'false'
    depends_on:
      validate:
        condition: service_completed_successfully
    networks:
      - appbot

  ingestor:
    image: ${APPBOT_IMAGE:-ghcr.io/oriel-beck/application-bot:latest}
    build: .
    command: ['node', 'src/scripts/ingest-wiki.js']
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
    volumes:
      - ./config.json:/app/config.json:ro
      - ./json:/app/json
    depends_on:
      validate:
        condition: service_completed_successfully
      chroma:
        condition: service_started
    networks:
      - appbot
    restart: 'no'
