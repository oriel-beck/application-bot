# VPS — shared Postgres/Redis on external network `infra`.
#
#   docker compose -f docker-compose.infra.yml up --build

name: application-bot

volumes:
  chroma_data: {}

networks:
  appbot: {}
  infra:
    external: true
    name: infra

services:
  appbot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
      REDIS_HOST: redis
    depends_on:
      - chroma
    networks:
      - appbot
      - infra

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    networks:
      - appbot

  ingestor:
    build: .
    command: ["node", "src/scripts/ingest-wiki.js"]
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
    depends_on:
      - chroma
    networks:
      - appbot
    restart: "no"
