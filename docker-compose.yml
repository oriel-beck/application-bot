version: '3.9'

volumes:
  postgres_db: {}
  redis_data: {}
  chroma_data: {}

networks:
  appbot: {}

services:
  appbot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
    depends_on:
      - postgres
      - redis
      - chroma
    networks:
      - appbot

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    networks:
      - appbot

  ingestor:
    build: .
    command: ["node", "src/scripts/ingest-wiki.js"]
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
    depends_on:
      - chroma
    networks:
      - appbot
    restart: "no"

  postgres:
    image: postgres
    restart: unless-stopped
    volumes:
      - postgres_db:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - 5432
    networks:
      - appbot
  
  redis:
    image: bitnami/redis
    restart: unless-stopped
    volumes:
      - redis_data:/bitnami/redis/data
    networks:
      - appbot
    ports:
      - 6379
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
