# Local / all-in-one stack — Postgres, Redis, Chroma, bot, ingestor.
#
# Pulls ghcr.io/oriel-beck/application-bot by default. Override with APPBOT_IMAGE
# or pass --build to compile from this tree.

name: application-bot

volumes:
  postgres_db: {}
  redis_data: {}
  chroma_data: {}

networks:
  appbot: {}

services:
  validate:
    image: ${APPBOT_IMAGE:-ghcr.io/oriel-beck/application-bot:latest}
    build: .
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
      REDIS_HOST: redis
      VALIDATE_POSTGRES: '1'
    volumes:
      - ./config.json:/app/config.json:ro
      - ./json:/app/json
    command: ['node', 'src/scripts/validate-config.js']
    restart: 'no'
    networks:
      - appbot

  appbot:
    image: ${APPBOT_IMAGE:-ghcr.io/oriel-beck/application-bot:latest}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
      REDIS_HOST: redis
    volumes:
      - ./config.json:/app/config.json:ro
      - ./json:/app/json
    depends_on:
      validate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      chroma:
        condition: service_started
      ingestor:
        condition: service_completed_successfully
    networks:
      - appbot

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: 'false'
    depends_on:
      validate:
        condition: service_completed_successfully
    networks:
      - appbot

  ingestor:
    image: ${APPBOT_IMAGE:-ghcr.io/oriel-beck/application-bot:latest}
    build: .
    command: ['node', 'src/scripts/ingest-wiki.js']
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
    volumes:
      - ./config.json:/app/config.json:ro
      - ./json:/app/json
    depends_on:
      validate:
        condition: service_completed_successfully
      chroma:
        condition: service_started
    networks:
      - appbot
    restart: 'no'

  postgres:
    image: postgres
    restart: unless-stopped
    volumes:
      - postgres_db:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - 5432
    depends_on:
      validate:
        condition: service_completed_successfully
    networks:
      - appbot

  redis:
    image: bitnami/redis
    restart: unless-stopped
    volumes:
      - redis_data:/bitnami/redis/data
    networks:
      - appbot
    ports:
      - 6379
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    depends_on:
      validate:
        condition: service_completed_successfully
