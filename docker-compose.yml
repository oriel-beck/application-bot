version: '3.9'

volumes:
  postgres_db: {}
  redis_data: {}

networks:
  appbot: {}

services:
  appbot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - appbot

  postgres:
    image: postgres
    restart: unless-stopped
    volumes:
      - postgres_db:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - 5432
    networks:
      - appbot
  
  redis:
    image: bitnami/redis
    restart: unless-stopped
    volumes:
      - redis_data:/bitnami/redis/data
    networks:
      - appbot
    ports:
      - 6379
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
